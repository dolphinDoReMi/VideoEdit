org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official

# Keystore configuration for release builds
KEYSTORE_FILE=../keystore/mira-release.keystore
KEYSTORE_PASSWORD=Mira2024!
KEY_ALIAS=mira
KEY_PASSWORD=Mira2024!

# Xiaomi Store configuration
XIAOMI_APP_KEY=your_xiaomi_app_key_here
XIAOMI_APP_SECRET=your_xiaomi_app_secret_here

# Build optimization
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Memory optimization for Xiaomi Pad
android.enableR8.fullMode=true
android.enableDexingArtifactTransform.desugaring=false
android.useAndroidX=true
android.enableJetifier=true

# Increase heap size for Android builds - Maximum for 12GB Xiaomi Pad
android.jvmArgs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
android.enableR8.fullMode=true
android.enableDexingArtifactTransform.desugaring=false
android.useAndroidX=true
android.enableJetifier=true

# Maximum memory configuration for Xiaomi Pad
android.enableBuildCache=false