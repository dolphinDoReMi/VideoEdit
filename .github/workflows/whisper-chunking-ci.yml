name: Whisper Chunking CI/CD

on:
  push:
    branches: [ whisper-chunking ]
  pull_request:
    branches: [ whisper-chunking ]

jobs:
  whisper-chunking-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
      
    - name: Run Android build
      run: ./gradlew assembleDebug assembleMinimal
      
    - name: Install web dependencies
      run: npm ci
      
    - name: Build web assets
      run: npm run build
      
    - name: Run CI/CD pipeline
      run: chmod +x scripts/cicd.sh && ./scripts/cicd.sh android unit web
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: whisper-chunking-build-artifacts
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/minimal/
          dist/
        retention-days: 7
        
    - name: Generate build report
      run: |
        echo "# Whisper Chunking CI/CD Report" > build_report.md
        echo "## Branch: whisper-chunking" >> build_report.md
        echo "## Commit: ${{ github.sha }}" >> build_report.md
        echo "## Status: ✅ PASSED" >> build_report.md
        echo "## Timestamp: $(date)" >> build_report.md
        echo "" >> build_report.md
        echo "### Build Artifacts:" >> build_report.md
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "- Debug APK: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)" >> build_report.md
        fi
        if [ -f "app/build/outputs/apk/minimal/app-minimal.apk" ]; then
          echo "- Minimal APK: $(du -h app/build/outputs/apk/minimal/app-minimal.apk | cut -f1)" >> build_report.md
        fi
        if [ -d "dist" ]; then
          echo "- Web Build: $(du -sh dist/ | cut -f1)" >> build_report.md
        fi
        
    - name: Upload build report
      uses: actions/upload-artifact@v3
      with:
        name: whisper-chunking-build-report
        path: build_report.md
        retention-days: 30

  whisper-chunking-integration:
    runs-on: ubuntu-latest
    needs: whisper-chunking-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Run integration tests
      run: |
        chmod +x scripts/cicd.sh
        ./scripts/cicd.sh android integration web
        
    - name: Run Whisper-specific tests
      run: |
        if [ -f "docs/whisper/scripts/test_comprehensive_pipeline.sh" ]; then
          chmod +x docs/whisper/scripts/test_comprehensive_pipeline.sh
          ./docs/whisper/scripts/test_comprehensive_pipeline.sh
        fi
        
    - name: Run UI tests
      run: |
        if [ -f "docs/ui/scripts/test_staging_implementation.sh" ]; then
          chmod +x docs/ui/scripts/test_staging_implementation.sh
          ./docs/ui/scripts/test_staging_implementation.sh
        fi

  whisper-chunking-deploy:
    runs-on: ubuntu-latest
    needs: [whisper-chunking-tests, whisper-chunking-integration]
    if: github.ref == 'refs/heads/whisper-chunking'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build release artifacts
      run: |
        chmod +x scripts/cicd.sh
        ./scripts/cicd.sh all all web
        
    - name: Create deployment package
      run: |
        mkdir -p deployment/whisper-chunking
        cp -r app/build/outputs/apk/debug/ deployment/whisper-chunking/
        cp -r app/build/outputs/apk/minimal/ deployment/whisper-chunking/
        cp -r dist/ deployment/whisper-chunking/
        
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: whisper-chunking-deployment
        path: deployment/whisper-chunking/
        retention-days: 30
        
    - name: Create deployment summary
      run: |
        echo "# Whisper Chunking Deployment Summary" > deployment_summary.md
        echo "## Branch: whisper-chunking" >> deployment_summary.md
        echo "## Commit: ${{ github.sha }}" >> deployment_summary.md
        echo "## Status: 🚀 DEPLOYED" >> deployment_summary.md
        echo "## Timestamp: $(date)" >> deployment_summary.md
        echo "" >> deployment_summary.md
        echo "### Deployment Artifacts:" >> deployment_summary.md
        echo "- Debug APK: Ready for testing" >> deployment_summary.md
        echo "- Minimal APK: Ready for testing" >> deployment_summary.md
        echo "- Web Build: Ready for deployment" >> deployment_summary.md
        echo "" >> deployment_summary.md
        echo "### Next Steps:" >> deployment_summary.md
        echo "1. Test the deployed artifacts" >> deployment_summary.md
        echo "2. Verify whisper chunking functionality" >> deployment_summary.md
        echo "3. Merge to main when ready" >> deployment_summary.md
